<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập trắc nghiệm – Giáo dục học</title>
<style>
  :root{
    --bg:#f3f7fb; --card:#ffffff; --ink:#26364a; --muted:#6b7c93;
    --primary:#4a7fd4; --primary-soft:#e6efff; --line:#dbe5f0;
    --ok:#2e9d6b; --ok-bg:#e3f6ec; --bad:#d9534f; --bad-bg:#fdeaea;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55}
  header{background:linear-gradient(135deg,#4a7fd4,#6aa5e8);color:#fff;padding:28px 16px 22px;text-align:center}
  header h1{margin:0 0 6px;font-size:1.55rem}
  header p{margin:0;opacity:.92;font-size:.95rem}
  .bar{position:sticky;top:0;z-index:10;background:rgba(243,247,251,.95);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:10px 16px}
  .bar-inner{max-width:1080px;margin:auto}
  .stats{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;font-size:.92rem}
  .stats b{font-size:1.02rem}
  .ok-t{color:var(--ok)} .bad-t{color:var(--bad)}
  .progress{height:8px;background:#dfe8f3;border-radius:99px;margin-top:8px;overflow:hidden}
  .progress>div{height:100%;width:0;background:var(--primary);transition:width .3s}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer}
  .btn{border:1px solid var(--primary);background:#fff;color:var(--primary);padding:6px 14px;border-radius:8px;font-size:.88rem}
  .btn:hover{background:var(--primary-soft)}
  .btn.main{background:var(--primary);color:#fff}
  .btn.main:hover{background:#3b6dbd}
  main{max-width:1080px;margin:18px auto 60px;padding:0 14px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
  .content{min-width:0}
  .nav{position:sticky;top:calc(var(--barh,90px) + 14px);display:flex;flex-wrap:wrap;gap:6px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px;max-height:calc(100vh - var(--barh,90px) - 28px);overflow:auto}
  .nav a{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;font-size:.82rem;
    text-decoration:none;color:var(--ink);background:#eef3f9;border:1px solid transparent}
  .nav a.ok{background:var(--ok-bg);color:var(--ok);border-color:#b8e4cf}
  .nav a.bad{background:var(--bad-bg);color:var(--bad);border-color:#f3c4c2}
  .nav a.cur{outline:2px solid var(--primary);outline-offset:1px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 12px;
    margin-bottom:14px;box-shadow:0 1px 3px rgba(40,70,110,.05);scroll-margin-top:calc(var(--barh,90px) + 14px)}
  .q h3{margin:0 0 12px;font-size:1.02rem;font-weight:600}
  .q h3 span{color:var(--primary)}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f8fafd;
    border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;color:var(--ink);transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
  .opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:#e3ebf6;display:grid;place-items:center;
    font-weight:600;font-size:.82rem;color:#456}
  .opt.correct{background:var(--ok-bg);border-color:var(--ok)}
  .opt.correct .k{background:var(--ok);color:#fff}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
  .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .fb{font-size:.88rem;margin:2px 0 6px;min-height:1px}
  .result{display:none;background:var(--card);border:2px solid var(--primary);border-radius:14px;
    padding:20px;text-align:center;margin-top:20px}
  .result h2{margin:0 0 6px;color:var(--primary)}
  .tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
  .tab{flex:1 1 0;min-width:96px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 10px;border-radius:10px;
    font-weight:600;font-size:.92rem;white-space:nowrap;transition:.15s}
  .tab small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
  .tab:hover{border-color:var(--primary);background:var(--primary-soft)}
  .tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .tab.active small{color:#e6efff}
  .tab.full:not(.active){border-color:#b8e4cf;background:var(--ok-bg);color:var(--ok)}
  body.weak{--primary:#d9822b;--primary-soft:#fff1de}
  body.weak header{background:linear-gradient(135deg,#d9822b,#f0a85a)}
  .topline{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;margin-bottom:8px}
  .modes{display:flex;gap:6px}
  .mode{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;border-radius:99px;font-size:.88rem;font-weight:600}
  .mode:hover{border-color:var(--primary);background:var(--primary-soft)}
  .mode.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:99px;background:#fff1de;color:#b5661a;font-size:.78rem;text-align:center}
  .mode.active .badge{background:#fff;color:var(--primary)}
  .auto{font-size:.84rem;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
  .acts{display:flex;justify-content:flex-end;margin:0 0 6px}
  .star,.del{border:1px dashed #e0b27a;background:#fffaf2;color:#b5661a;padding:5px 12px;border-radius:8px;font-size:.84rem}
  .star:hover,.del:hover{background:#fff1de}
  .star.on{border-style:solid;background:#fff1de;font-weight:600}
  .del{border-color:#b8e4cf;background:var(--ok-bg);color:var(--ok)}
  .del:hover{background:#d3f0e1}
  .tag{color:var(--muted);font-weight:400}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:2rem;margin-bottom:6px}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding-bottom:24px}
  @media(max-width:860px){
    main{display:block}
    .nav{top:var(--barh,90px);z-index:9;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-height:none;
      border-radius:0 0 12px 12px;margin:0 0 14px;padding:8px 10px}
    .nav a{flex:none}
    .q{scroll-margin-top:calc(var(--barh,90px) + 60px)}
  }
  @media(max-width:520px){header h1{font-size:1.25rem}.q{padding:14px 12px 8px}}
</style>
</head>
<body>
<header>
  <h1>📘 Ôn tập trắc nghiệm</h1>
  <p id="sub"></p>
</header>

<div class="bar"><div class="bar-inner">
  <div class="topline">
    <div class="modes"><button class="mode" id="mode-quiz"></button><button class="mode" id="mode-weak"></button></div>
    <label class="auto"><input type="checkbox" id="auto"> Tự lưu câu làm sai</label>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="stats">
    <div>Đã làm: <b id="done">0</b>/<b id="total">0</b> &nbsp;·&nbsp;
      <span class="ok-t">Đúng: <b id="right">0</b></span> &nbsp;·&nbsp;
      <span class="bad-t">Sai: <b id="wrong">0</b></span></div>
    <div class="btns">
      <button class="btn" id="shuffle">🔀 Xáo trộn</button>
      <button class="btn main" id="reset">↺ Làm lại</button>
    </div>
  </div>
  <div class="progress"><div id="pbar"></div></div>
</div></div>

<main>
  <div class="nav" id="nav"></div>
  <div class="content"><div id="list"></div>
  <div class="result" id="result">
    <h2 id="rtitle"></h2>
    <p id="rtext"></p>
    <button class="btn main" onclick="resetQuiz(false)">Làm lại từ đầu</button>
  </div></div>
</main>
<footer>Chọn một đáp án để xem đúng/sai ngay lập tức · Bấm ☆ để lưu câu hay nhầm vào mục “Câu hay sai”.</footer>

i đa lượng kiến thức cho người học", "Tạo ra lợi nhuận kinh tế trực tiếp", "Đào tạo người học thi đỗ vào cấp học cao hơn", "Hình thành và phát triển toàn diện nhân cách cho người học"], "a": 3}, {"q": "Câu \"Nghề dạy học là một nghề sáng tạo bậc nhất vì nó sáng tạo ra những con người sáng tạo\" là của:", "o": ["Hồ Chí Minh", "Phạm Văn Đồng", "Lê Duẩn", "Cômenxki"], "a": 1}, {"q": "Đối tượng của hoạt động sư phạm là:", "o": ["Chương trình và sách giáo khoa", "Cơ sở vật chất của nhà trường", "Người học, thế hệ trẻ đang trong giai đoạn hình thành và phát triển nhân cách", "Đội ngũ giáo viên"], "a": 2}, {"q": "Công cụ quan trọng nhất, chủ yếu nhất của hoạt động sư phạm là:", "o": ["Nhân cách của người giáo viên", "Sách giáo khoa", "Thiết bị công nghệ dạy học", "Phòng học và đồ dùng dạy học"], "a": 0}, {"q": "Sản phẩm của hoạt động sư phạm là:", "o": ["Điểm số và thành tích của học sinh", "Giáo án và tài liệu giảng dạy", "Số lượng học sinh tốt nghiệp", "Nhân cách toàn diện của người học"], "a": 3}, {"q": "Việc đánh giá chất lượng và hiệu quả của hoạt động sư phạm khó khăn, lâu dài vì:", "o": ["Giáo viên không muốn bị đánh giá", "Sản phẩm của hoạt động sư phạm có tính chất đặc thù, không phải sản phẩm vật chất trực tiếp", "Chưa có quy định về đánh giá giáo viên", "Học sinh không hợp tác khi đánh giá"], "a": 1}, {"q": "Nhà sư phạm V. A. Xu-khôm-lin-xki cho rằng lao động của người giáo viên:", "o": ["Dễ đánh giá nhất trong các loại lao động", "Cho kết quả ngay sau một học kì", "Có sai lầm và thất bại dẫn đến hậu quả nặng nề như không lao động nào khác", "Không cần thời gian dài mới thấy kết quả"], "a": 2}, {"q": "Môi trường sư phạm là môi trường:", "o": ["Được chọn lựa, xây dựng có mục đích sư phạm, không chỉ ở trường học mà cả ở gia đình và cộng đồng", "Chỉ gồm phòng học và trang thiết bị", "Hoàn toàn tự nhiên, không có sự tác động của giáo viên", "Chỉ tồn tại trong nhà trường"], "a": 0}, {"q": "Hoạt động sư phạm là một dạng hoạt động có tính chất:", "o": ["Chỉ mang tính k goài nhà trường (gia đình, đoàn thể xã hội, cộng đồng dân cư...) là:", "o": ["Một nguyên tắc giáo dục, đồng thời là một trong những nội dung thực hiện xã hội hoá giáo dục", "Việc làm tuỳ chọn của giáo viên", "Nhiệm vụ riêng của hiệu trưởng", "Nhiệm vụ riêng của ban đại diện cha mẹ học sinh"], "a": 0}, {"q": "Hình thức phối hợp của giáo viên chủ nhiệm với cha mẹ học sinh KHÔNG bao gồm:", "o": ["Hội nghị cha mẹ học sinh định kì", "Phiếu liên lạc, tiếp xúc riêng", "Trao đổi thông tin qua phương tiện liên lạc, công nghệ", "Giao khoán việc giáo dục học sinh cho cha mẹ"], "a": 3}, {"q": "Đối với ban đại diện cha mẹ học sinh lớp, giáo viên chủ nhiệm:", "o": ["Giao toàn quyền điều hành", "Phát huy vai trò và định hướng cho ban đại diện hoạt động", "Không cần phối hợp", "Chỉ làm việc khi học sinh vi phạm"], "a": 1}, {"q": "Theo Điều lệ trường tiểu học (2020), nhiệm vụ của giáo viên chủ nhiệm KHÔNG bao gồm:", "o": ["Chủ động nắm bắt thông tin từng học sinh của lớp được phân công", "Phối hợp chặt chẽ với cha mẹ học sinh, giáo viên, tổng phụ trách Đội, các tổ chức xã hội có liên quan", "Quyết định phân công giáo viên bộ môn dạy lớp mình chủ nhiệm", "Báo cáo thường kì hoặc đột xuất về tình hình của lớp với hiệu trưởng"], "a": 2}, {"q": "Theo Điều lệ trường tiểu học, giáo viên chủ nhiệm thực hiện các hoạt động giáo dục theo kế hoạch đã xây dựng và:", "o": ["Được hiệu trưởng phê duyệt", "Được phụ huynh đồng ý", "Được Sở Giáo dục phê duyệt", "Được Hội đồng trường phê duyệt"], "a": 0}, {"q": "Theo Điều lệ trường tiểu học, giáo viên chủ nhiệm tổng hợp nhận xét, đánh giá học sinh vào thời điểm:", "o": ["Đầu năm học và cuối năm học", "Hằng tuần", "Hằng tháng", "Cuối kì I và cuối năm học"], "a": 3}, {"q": "Theo Điều lệ trường tiểu học, giáo viên chủ nhiệm báo cáo thường kì hoặc đột xuất về tình hình của lớp với:", "o": ["Sở Giáo dục", "Hiệu trưởng", "Phòng Giáo dục", "Cha mẹ học sinh"], "a": 1}, {"q": "Theo Điều lệ trường trung học cơ sở và trung học phổ thông (2020), giáo viên chủ nhiệm phối hợp với:", "o": ["Chỉ gia đình học sinh", "Chỉ Đoàn Thanh niên Cộng sản Hồ Chí Minh", "Chỉ các tổ chức xã hội", "Đội Thiếu niên Tiền phong Hồ Chí Minh, Đoàn Thanh niên Cộng sản Hồ Chí Minh, Hội Liên hiệp Thanh niên Việt Nam, gia đình học sinh và các tổ chức xã hội liên quan"], "a": 3}, {"q": "Theo Điều lệ trường trung học cơ sở và trung học phổ thông (2020), giáo viên chủ nhiệm còn có nhiệm vụ:", "o": ["Tham gia công tác phổ cập giáo dục trung học cơ sở ở địa phương; học tập, rèn luyện nâng cao trình độ, đổi mới phương pháp dạy học, giáo dục", "Chỉ dạy học", "Quản lí tài chính nhà trường", "Tuyển sinh đầu cấp"], "a": 0}, {"q": "Việc tìm hiểu và nắm vững đối tượng giáo dục là:", "o": ["Việc chỉ làm khi mới nhận lớp", "Việc chỉ làm khi học sinh vi phạm", "Vừa là nội dung, vừa là điều kiện để làm tốt công tác giáo dục", "Việc của giáo viên bộ môn"], "a": 2}, {"q": "Nội dung nào thuộc việc tìm hiểu tập thể học sinh?", "o": ["Sở thích, năng khiếu của từng em", "Trình độ phát triển, truyền thống, bầu không khí, các mối quan hệ trong tập thể, nhóm tự phát, thủ lĩnh tự phát, mặt mạnh, mặt yếu", "Hoàn cảnh sống riêng của từng học sinh", "Sức khoẻ của từng học sinh"], "a": 1}, {"q": "Nội dung nào thuộc việc tìm hiểu cá nhân học sinh?", "o": ["Truyền thống của tập thể", "Bầu không khí của lớp", "Sự phân hoá các nhóm tự phát", "Đặc điểm tâm sinh lí, tính cách, năng lực, sức khoẻ, sở thích, nguyện vọng, năng khiếu, hoàn cảnh sống, quan hệ với tập thể, bè bạn"], "a": 3}, {"q": "Cách thức tìm hiểu học sinh KHÔNG bao gồm:", "o": ["Nghiên cứu hồ sơ học sinh (lí lịch, học bạ, sổ liên lạc)", "Chỉ dựa vào ấn tượng ban đầu của giáo viên", "Quan sát có chủ định hoặc ngẫu nhiên", "Thu thập thông tin bằng phiếu hỏi, phiếu khảo sát"], "a": 1}, {"q": "Việc tìm hiểu học sinh là công việc:", "o": ["Chỉ làm trong một, hai ngày đầu", "Chỉ tiến hành trong giai đoạn mới nhận lớp", "Thường xuyên, liên tục trong suốt năm học", "Chỉ làm vào cuối học kì"], "a": 2}, {"q": "Khi tìm hiểu học sinh, giáo viên chủ nhiệm cần tránh:", "o": ["Hời hợt, chủ quan, thiên vị, cảm tính trong đánh giá", "Ghi chép, lưu giữ thông tin", "Phối hợp nhiều cách thức tìm hiểu", "Phân tích nguyên nhân của các hiện trạng"], "a": 0}, {"q": "Việc phân loại học sinh theo nhiều tiêu chí (học lực, hạnh kiểm, nguyên nhân, quan hệ xã hội, tính cách, đối tượng đặc biệt...) nhằm:", "o": ["Xếp hạng học sinh", "Loại bỏ học sinh yếu", "Chỉ để tuyển chọn học sinh giỏi", "Có kế hoạch theo dõi, tác động phù hợp với từng đối tượng học sinh"], "a": 3}, {"q": "Kế hoạch giáo dục của lớp chủ nhiệm là:", "o": ["Bản thiết kế cụ thể toàn bộ nội dung hoạt động giáo dục của lớp, là chương trình hành động thực thi của lớp trong một giai đoạn cụ thể", "Thời khoá biểu của lớp", "Bảng phân công trực nhật", "Danh sách học sinh của lớp"], "a": 0}, {"q": "Ý nghĩa của kế hoạch giáo dục đối với giáo viên chủ nhiệm KHÔNG bao gồm:", "o": ["Vạch ra phương hướng phát triển đi lên của tập thể học sinh", "Tạo sự thống nhất, huy động sức mạnh tổng hợp của các lực lượng giáo dục", "Thay thế hoàn toàn kế hoạch giáo dục của nhà trường", "Giúp giáo viên và học sinh chủ động, tiết kiệm thời gian, công sức"], "a": 2}, {"q": "Căn cứ để xây dựng kế hoạch giáo dục KHÔNG bao gồm:", "o": ["Mục tiêu, chương trình hành động của ngành và cấp học", "Sở thích riêng của giáo viên chủ nhiệm", "Đặc điểm tình hình của địa phương", "Mục tiêu, kế hoạch công tác của các tổ chức đoàn thể trong trường"], "a": 1}, {"q": "Tính toàn diện của kế hoạch giáo dục là:", "o": ["Chỉ tập trung vào một mảng nội dung", "Mô tả chi tiết từng hoạt động", "Nhấn mạnh hoạt động trọng tâm", "Đề cập tất cả các nội dung giáo dục toàn diện cho học sinh, không xem nhẹ một nội dung nào"], "a": 3}, {"q": "Tính cụ thể của kế hoạch giáo dục thể hiện ở:", "o": ["Từng hoạt động, yêu cầu, thời gian, nội dung công việc, biện pháp tiến hành, lực lượng tham gia, dự kiến kết quả", "Đề cập tất cả nội dung giáo dục", "Nhấn mạnh trọng tâm từng giai đoạn", "Chỉ ghi mục tiêu chung"], "a": 0}, {"q": "Tính trọng tâm của kế hoạch giáo dục là:", "o": ["Mọi nội dung có tầm quan trọng như nhau", "Chỉ tập trung vào học tập", "Tuỳ từng thời gian, từng lớp mà nhấn mạnh hoạt động trọng tâm nào", "Chỉ tập trung vào phong trào"], "a": 2}, {"q": "Bước đầu tiên trong xây dựng kế hoạch giáo dục của lớp chủ nhiệm là:", "o": ["Xác định mục tiêu, chỉ tiêu cần đạt", "Phân tích, đánh giá tình hình, đặc điểm lớp học", "Xây dựng nội dung hoạt động giáo dục", "Phân công lực lượng tham gia"], "a": 1}, {"q": "Bước hai trong xây dựng kế hoạch giáo dục là:", "o": ["Xây dựng các biện pháp, điều kiện thực hiện", "Phân công lực lượng tham gia", "Định hướng kiểm tra, đánh giá", "Xác định mục tiêu, chỉ tiêu cần đạt"], "a": 3}, {"q": "Yêu cầu khi biểu đạt mục tiêu của kế hoạch giáo dục là:", "o": ["Cụ thể, dễ hiểu, có tính định hướng, đo lường được, vừa sức với lớp, có giới hạn thời gian", "Chung chung, khái quát", "Cao nhất có thể", "Không cần giới hạn thời gian"], "a": 0}, {"q": "Bước “xây dựng các biện pháp, điều kiện thực hiện” yêu cầu:", "o": ["Chỉ nêu mục tiêu chung", "Chỉ phân công người thực hiện", "Lựa chọn cách thức cụ thể, rõ ràng, khả thi, mô tả đầy đủ biện pháp, phương tiện, thiết bị hỗ trợ, hình thức tổ chức phù hợp với từng nội dung", "Chỉ dự kiến thời gian"], "a": 2}, {"q": "Việc phân công lực lượng tham gia và thể hiện tiến độ thực hiện nhằm:", "o": ["Giảm công việc cho giáo viên", "Gắn công việc với trách nhiệm cá nhân, giúp giáo viên chủ nhiệm dễ theo dõi quá trình và kết quả thực hiện", "Chỉ để tăng số người tham gia", "Chỉ để báo cáo nhà trường"], "a": 1}, {"q": "Bước cuối cùng “định hướng kiểm tra, đánh giá và điều chỉnh việc thực hiện kế hoạch” yêu cầu giáo viên chủ nhiệm:", "o": ["Chỉ kiểm tra vào cuối năm", "Chỉ nhận xét chung chung", "Không cần điều chỉnh kế hoạch", "Dự kiến nội dung, xây dựng tiêu chí và phương pháp kiểm tra, đánh giá; theo dõi, điều chỉnh kịp thời; thu thập thông tin cho các chu kì sau"], "a": 3}, {"q": "Thứ tự đúng các bước xây dựng kế hoạch giáo dục của lớp chủ nhiệm là:", "o": ["Phân tích đánh giá tình hình → Xác định mục tiêu → Xây dựng nội dung → Xây dựng biện pháp, điều kiện → Phân công lực lượng, tiến độ → Định hướng kiểm tra, đánh giá, điều chỉnh", "Xác định mục tiêu → Phân tích tình hình → Xây dựng nội dung → Phân công lực lượng → Xây dựng biện pháp → Kiểm tra", "Xây dựng nội dung → Xác định mục tiêu → Phân tích tình hình → Kiểm tra → Phân công → Biện pháp", "Phân công lực lượng → Xây dựng biện pháp → Xác định mục tiêu → Phân tích tình hình → Nội dung → Kiểm tra"], "a": 0}, {"q": "Tập thể là:", "o": ["Một nhóm người tập hợp ngẫu nhiên", "Một cộng đồng xã hội đặc biệt, hình thái tổ chức xã hội tập hợp những người có cùng mục đích, có hoạt động chung, có tổ chức chặt chẽ và hệ thống quan hệ phụ thuộc giữa các thành viên", "Một nhóm bạn thân", "Một tổ chức hành chính của nhà trường"], "a": 1}, {"q": "Đặc trưng nào sau đây KHÔNG phải là đặc trưng chủ yếu của tập thể học sinh?", "o": ["Có mục đích chung", "Có hoạt động chung", "Có đội ngũ cán bộ tự quản do giáo viên chỉ định", "Có hệ thống các quan hệ phức hợp"], "a": 2}, {"q": "Hệ thống quan hệ phức hợp trong tập thể học sinh gồm:", "o": ["Quan hệ nghĩa vụ – quyền lợi, chỉ huy – phục tùng, phối hợp – tương tác, tình cảm – trách nhiệm", "Chỉ quan hệ chỉ huy – phục tùng", "Chỉ quan hệ bạn bè", "Chỉ quan hệ cạnh tranh"], "a": 0}, {"q": "Trong trường phổ thông, tập thể học sinh là:", "o": ["Chỉ nhóm bạn thân", "Chỉ nhóm học tập", "Chỉ tổ chức hành chính", "Môi trường tâm lí – xã hội trực tiếp ảnh hưởng đến học sinh"], "a": 3}, {"q": "Những phẩm chất nhân cách chỉ có thể hình thành trong môi trường giáo dục tập thể là:", "o": ["Trí nhớ, chú ý", "Tinh thần tập thể, tính kỉ luật, ý thức trách nhiệm, tinh thần hợp tác, năng lực tự ý thức", "Thể lực", "Năng khiếu bẩm sinh"], "a": 1}, {"q": "Yếu tố nào sau đây KHÔNG thuộc các yếu tố của tập thể có tác dụng là phương tiện giáo dục, điều chỉnh hành vi học sinh?", "o": ["Truyền thống của tập thể", "Dư luận tập thể", "Điểm số trung bình của lớp", "Hệ thống viễn cảnh của tập thể"], "a": 2}, {"q": "Tập thể học sinh ở trường phổ thông hình thành và phát triển qua ba giai đoạn theo thứ tự:", "o": ["Tập thể hình thành → Tập thể phát triển → Tập thể phát triển vững mạnh", "Tập thể phát triển → Tập thể hình thành → Tập thể vững mạnh", "Tập thể vững mạnh → Tập thể phát triển → Tập thể hình thành", "Tập thể hình thành → Tập thể vững mạnh → Tập thể phát triển"], "a": 0}, {"q": "Giai đoạn tập thể hình thành được đặc trưng bởi:", "o": ["Dư luận tập thể vững chắc", "Sự phân hoá thành ba nhóm", "Kỉ luật tự giác", "Tính tổ chức, kỉ luật rời rạc, học sinh chưa hiểu biết nhau, chưa có quan hệ và hoạt động chung; thường xảy ra ở lớp đầu cấp một thời gian ngắn sau khi tập hợp"], "a": 3}, {"q": "Giai đoạn tập thể phát triển được đặc trưng bởi sự phân hoá thành ba nhóm:", "o": ["Nhóm giỏi, nhóm khá, nhóm trung bình", "Nhóm phần tử tích cực (hạt nhân nòng cốt), nhóm thành viên thụ động, nhóm thành viên chậm tiến, cá biệt", "Nhóm nam, nhóm nữ, nhóm cán bộ", "Nhóm cán bộ lớp, nhóm tổ trưởng, nhóm học sinh"], "a": 1}, {"q": "Đặc trưng cơ bản của giai đoạn tập thể phát triển vững mạnh là:", "o": ["Học sinh chưa hiểu biết nhau", "Tổ chức, kỉ luật còn yếu", "Dư luận tập thể được hình thành, củng cố vững chắc; tổ chức chặt chẽ, kỉ luật tự giác; yêu cầu của giáo viên chuyển hoá thành yêu cầu của tập thể", "Chỉ có nhóm tích cực hoạt động"], "a": 2}, {"q": "Tác động sư phạm của giáo viên chủ nhiệm nhất thiết phải hướng đến việc xây dựng tập thể học sinh đạt trình độ phát triển ở giai đoạn:", "o": ["Phát triển vững mạnh", "Hình thành", "Phát triển", "Rời rạc"], "a": 0}, {"q": "Việc lựa chọn và phân công đội ngũ cán bộ lớp có thể dựa trên cơ sở:", "o": ["Chỉ do giáo viên chỉ định", "Chỉ theo thứ tự danh sách lớp", "Chỉ theo ý kiến phụ huynh", "Kết quả học tập, rèn luyện trước đó; thông tin từ giáo viên chủ nhiệm các năm trước; bầu chọn của học sinh; hoặc khuyến khích học sinh tự nhận nhiệm vụ"], "a": 3}, {"q": "Việc quy định rõ chức năng, nhiệm vụ của từng vị trí cán bộ lớp nhằm tránh tình trạng:", "o": ["Cán bộ lớp quá rảnh rỗi", "Ôm đồm, giẫm chân nhau hoặc né tránh công việc", "Học sinh không muốn làm cán bộ", "Giáo viên chủ nhiệm mất quyền quản lí"], "a": 1}, {"q": "Lớp trưởng là người:", "o": ["Chỉ phụ trách học tập", "Chỉ phụ trách kỉ luật", "Phụ trách chung các mặt, điều hành bộ máy cán bộ lớp, chịu trách nhiệm trước giáo viên chủ nhiệm và tập thể lớp về mọi mặt phát triển của lớp", "Chỉ phụ trách phong trào"], "a": 2}, {"q": "Lớp phó học tập có nhiệm vụ:", "o": ["Theo dõi tình hình học tập của lớp, đề xuất và tổ chức các hoạt động xây dựng tinh thần, thái độ học tập tích cực, nâng cao chất lượng học tập", "Quản lí nội quy", "Tổ chức văn nghệ, thể thao", "Quản lí các thành viên trong tổ"], "a": 0}, {"q": "Lớp phó kỉ luật chịu trách nhiệm:", "o": ["Tổ chức văn nghệ, cắm trại", "Hỗ trợ các môn học", "Theo dõi học tập", "Quản lí việc thực hiện nội quy, xây dựng ý thức kỉ luật của học sinh, đề xuất và tiến hành biện pháp củng cố kỉ luật tập thể"], "a": 3}, {"q": "Lớp phó phong trào chịu trách nhiệm:", "o": ["Quản lí kỉ luật", "Theo dõi, đề xuất và tổ chức các hoạt động phong trào như văn nghệ, thể thao, báo chí, tham quan, cắm trại, giao lưu", "Theo dõi học tập", "Hỗ trợ các môn học"], "a": 1}, {"q": "Cán sự bộ môn có nhiệm vụ:", "o": ["Điều hành toàn lớp", "Quản lí kỉ luật", "Hỗ trợ lớp phó học tập trong phạm vi môn học mình phụ trách, giúp bạn học tốt bộ môn", "Tổ chức phong trào"], "a": 2}, {"q": "Các kĩ năng cơ bản giáo viên chủ nhiệm cần hướng dẫn cán bộ lớp gồm:", "o": ["Ghi chép sổ công tác, lập kế hoạch hoạt động, điều hành sinh hoạt lớp, trình bày thuyết phục, vận động, tổ chức hoạt động tập thể", "Kĩ năng thi cử", "Kĩ năng giảng dạy", "Kĩ năng quản lí tài chính"], "a": 0}, {"q": "Đối với cán bộ lớp, giáo viên chủ nhiệm cần:", "o": ["Làm thay mọi việc", "Không cần kiểm tra, đánh giá", "Chỉ phê bình khi sai sót", "Thực hiện đúng vai trò cố vấn, mạnh dạn giao việc, tin tưởng; kiểm tra, đánh giá, động viên kịp thời; xây dựng, củng cố và bảo vệ uy tín của cán bộ lớp"], "a": 3}, {"q": "Mục tiêu ngắn hạn của tập thể học sinh là:", "o": ["Mục tiêu khó, đòi hỏi nhiều thời gian", "Mục tiêu đơn giản, thời gian thực hiện ngắn (một tuần, một tháng), như những viễn cảnh gần tạo trạng thái mong đợi hứng thú", "Mục tiêu thi tốt nghiệp", "Mục tiêu của cả cấp học"], "a": 1}, {"q": "Mục tiêu dài hạn của tập thể học sinh có ví dụ là:", "o": ["Buổi biểu diễn văn nghệ vào tuần sau", "Dọn vệ sinh lớp hằng ngày", "Kế hoạch cắm trại cuối năm âm lịch, mục tiêu thi tốt nghiệp, thi đại học", "Làm bài tập về nhà"], "a": 2}, {"q": "Yêu cầu giáo dục đối với học sinh cần:", "o": ["Phù hợp mục tiêu chung của tập thể, đặc điểm và khả năng thực hiện; thống nhất trong tập thể; có độ khó tăng dần; được giải thích ý nghĩa và theo dõi, hướng dẫn, kiểm tra trong quá trình thực hiện", "Giữ nguyên mức độ khó, không thay đổi", "Đưa ra rồi để học sinh tự thực hiện, không kiểm tra", "Chỉ mang tính hình thức, chiếu lệ"], "a": 0}, {"q": "Kỉ luật tích cực là:", "o": ["Sự cưỡng bức học sinh tuân theo", "Hình thức trừng phạt nghiêm khắc", "Quy định chỉ có giáo viên đặt ra", "Kết quả của quá trình giáo dục ý thức ở học sinh, kết quả của những cố gắng tự giác, tích cực của tập thể"], "a": 3}, {"q": "Dư luận tập thể lành mạnh:", "o": ["Chỉ là ý kiến của giáo viên", "Phản ánh quan niệm, nhận định, đánh giá đúng đắn của tập thể; có tác dụng điều khiển, điều chỉnh mạnh mẽ ý thức, thái độ, hành vi của học sinh", "Không ảnh hưởng đến học sinh", "Chỉ là ý kiến của cán bộ lớp"], "a": 1}, {"q": "Biện pháp nào sau đây KHÔNG phải là biện pháp giáo dục truyền thống tốt và hình thành dư luận tập thể lành mạnh?", "o": ["Tìm hiểu, nắm vững đặc điểm lớp và học sinh, xác định mặt mạnh, mặt yếu", "Tổ chức họp lớp, diễn đàn tập thể (báo tường, tập san, bảng thông tin)", "Hạn chế các buổi họp lớp, diễn đàn tập thể để tránh tranh luận", "Phát huy vai trò mạng lưới tự quản và ph const NAMES = {1:'Chương 1',2:'Chương 2',3:'Chương 3',4:'Chương 4'};
const SUBS = {
  1:'Chương 1 · Hoạt động sư phạm · Nhân cách giáo viên · Bản chất giáo dục',
  2:'Chương 2 · Giáo dục học',
  3:'Chương 3 · Giáo dục phổ thông Việt Nam và hoạt động giáo dục ở nhà trường phổ thông',
  4:'Chương 4 · Công tác chủ nhiệm lớp ở trường phổ thông'
};
const LS_KEY='ongdh_cauhaysai_v1', LS_AUTO='ongdh_autosave_v1';
let weak = {1:[],2:[],3:[],4:[]};
let autoSave = false;
try{
  const w = JSON.parse(localStorage.getItem(LS_KEY)||'null');
  if(w) [1,2,3,4].forEach(c=>{ if(Array.isArray(w[c])) weak[c]=w[c].filter(i=>Number.isInteger(i)&&CH[c][i]); });
  autoSave = localStorage.getItem(LS_AUTO)==='1';
}catch(e){}
function persist(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(weak)); localStorage.setItem(LS_AUTO,autoSave?'1':'0'); }catch(e){}
}

let mode='quiz';            // 'quiz' = làm bài, 'weak' = câu hay sai
let cur=1, order=[], state={}, curIdx=-1;
const SESS={};
const skey=()=>mode+cur;

function shuffleArr(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function mkQ(c,i){
  const q=CH[c][i];
  return {id:i,text:q.q,opts:q.o.map((t,k)=>({t,ok:k===q.a}))};
}

function build(doShuffle){
  state={};
  let qs = mode==='quiz' ? CH[cur].map((_,i)=>mkQ(cur,i)) : weak[cur].map(i=>mkQ(cur,i));
  if(doShuffle){ shuffleArr(qs); qs.forEach(q=>shuffleArr(q.opts)); }
  order=qs;
  SESS[skey()]={order,state};
  render();
}

function setStar(b,saved){
  b.className='star'+(saved?' on':'');
  b.textContent = saved ? '★ Đã lưu vào câu hay sai' : '☆ Lưu vào câu hay sai';
}

function render(){
  document.body.classList.toggle('weak', mode==='weak');
  const list=document.getElementById('list'), nav=document.getElementById('nav');
  list.innerHTML=''; nav.innerHTML='';
  if(mode==='weak' && order.length===0){
    const d=document.createElement('div'); d.className='empty';
    d.innerHTML='<div class="big">⭐</div><b>Chưa có câu nào trong mục này ('+NAMES[cur]+')</b><br>'+
      'Hãy qua mục <b>Làm bài</b> và bấm <b>☆ Lưu vào câu hay sai</b> ở những câu bạn hay nhầm, '+
      'hoặc bật <b>Tự lưu câu làm sai</b> ở thanh trên.';
    list.appendChild(d);
  }
  order.forEach((q,idx)=>{
    const a=document.createElement('a'); a.href='#q'+idx; a.textContent=idx+1; a.id='n'+idx; nav.appendChild(a);
    const box=document.createElement('div'); box.className='q'; box.id='q'+idx;
    const h=document.createElement('h3'); h.innerHTML='<span>Câu '+(idx+1)+'.</span> '; h.append(q.text);
    if(mode==='weak'){
      const t=document.createElement('small'); t.className='tag'; t.textContent=' (câu gốc số '+(q.id+1)+')'; h.appendChild(t);
    }
    box.appendChild(h);
    q.opts.forEach((o,k)=>{
      const b=document.createElement('button'); b.className='opt';
      b.innerHTML='<span class="k">'+'ABCD'[k]+'</span><span></span>';
      b.lastChild.textContent=o.t;
      b.onclick=()=>choose(idx,k);
      box.appendChild(b);
    });
    const fb=document.createElement('div'); fb.className='fb'; box.appendChild(fb);
    const acts=document.createElement('div'); acts.className='acts';
    if(mode==='quiz'){
      const s=document.createElement('button');
      setStar(s, weak[cur].includes(q.id));
      s.onclick=()=>toggleSaved(idx,s);
      acts.appendChild(s);
    }else{
      const d=document.createElement('button'); d.className='del';
      d.textContent='✓ Đã nhớ – xoá khỏi danh sách';
      d.onclick=()=>removeWeak(idx);
      acts.appendChild(d);
    }
    box.appendChild(acts);
    list.appendChild(box);
    if(state[idx]!==undefined) applyChoice(idx,state[idx]);
  });
  update();
  curIdx=-1; markCurrent();
}

function applyChoice(idx,k){
  const q=order[idx], box=document.getElementById('q'+idx);
  const btns=box.querySelectorAll('.opt');
  btns.forEach((b,i)=>{ b.disabled=true; if(q.opts[i].ok) b.classList.add('correct'); });
  const fb=box.querySelector('.fb');
  if(q.opts[k].ok){
    fb.innerHTML='<b class="ok-t">✔ Chính xác!</b>';
  }else{
    btns[k].classList.add('wrong');
    const right=q.opts.findIndex(o=>o.ok);
    fb.innerHTML='<b class="bad-t">✘ Chưa đúng.</b> Đáp án đúng: '+'ABCD'[right];
  }
  document.getElementById('n'+idx).classList.add(q.opts[k].ok?'ok':'bad');
}

function choose(idx,k){
  if(state[idx]!==undefined) return;
  state[idx]=k;
  applyChoice(idx,k);
  if(mode==='quiz' && autoSave && !order[idx].opts[k].ok && !weak[cur].includes(order[idx].id)){
    weak[cur].push(order[idx].id); persist();
    const s=document.querySelector('#q'+idx+' .star'); if(s) setStar(s,true);
  }
  update();
}

function toggleSaved(idx,btn){
  const id=order[idx].id, l=weak[cur], p=l.indexOf(id);
  if(p>=0) l.splice(p,1); else l.push(id);
  persist();
  setStar(btn, p<0);
  update();
}

function removeWeak(idx){
  const id=order[idx].id;
  weak[cur]=weak[cur].filter(x=>x!==id);
  persist();
  order.splice(idx,1);
  const ns={};
  for(const i in state){ const n=+i; if(n<idx) ns[n]=state[n]; else if(n>idx) ns[n-1]=state[n]; }
  state=ns;
  SESS[skey()]={order,state};
  render();
}

function buildTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  [1,2,3,4].forEach(c=>{
    const b=document.createElement('button'); b.className='tab'; b.id='tab'+c;
    b.onclick=()=>switchTab(c);
    t.appendChild(b);
  });
}

function updateTabs(){
  [1,2,3,4].forEach(c=>{
    const b=document.getElementById('tab'+c);
    if(mode==='quiz'){
      const done = c===cur ? Object.keys(state).length : (SESS['quiz'+c]?Object.keys(SESS['quiz'+c].state).length:0);
      const total = CH[c].length;
      b.className='tab'+(c===cur?' active':'')+(done===total?' full':'');
      b.innerHTML=NAMES[c]+' <small>'+done+'/'+total+'</small>';
    }else{
      b.className='tab'+(c===cur?' active':'');
      b.innerHTML=NAMES[c]+' <small>'+weak[c].length+' câu hay sai</small>';
    }
  });
}

function updateModes(){
  const n=[1,2,3,4].reduce((s,c)=>s+weak[c].length,0);
  const q=document.getElementById('mode-quiz'), w=document.getElementById('mode-weak');
  q.className='mode'+(mode==='quiz'?' active':'');
  w.className='mode'+(mode==='weak'?' active':'');
  q.textContent='📘 Làm bài';
  w.innerHTML='⭐ Câu hay sai <span class="badge">'+n+'</span>';
}

function update(){
  const total=order.length, done=Object.keys(state).length;
  let right=0; for(const i in state){ if(order[i].opts[state[i]].ok) right++; }
  document.getElementById('total').textContent=total;
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('wrong').textContent=done-right;
  document.getElementById('pbar').style.width=(total?done/total*100:0)+'%';
  document.getElementById('sub').textContent = mode==='quiz' ? SUBS[cur] : '⭐ Câu hay sai · '+NAMES[cur];
  const r=document.getElementById('result');
  if(total>0 && done===total){
    const pct=Math.round(right/total*100);
    document.getElementById('rtitle').textContent=(mode==='weak'?'Ôn câu hay sai – ':'')+NAMES[cur]+' – Kết quả: '+right+'/'+total+' ('+pct+'%)';
    document.getElementById('rtext').textContent = mode==='weak'
      ? 'Câu nào đã nhớ rồi thì bấm “Đã nhớ – xoá khỏi danh sách”, câu chưa nhớ cứ để lại ôn tiếp.'
      : (pct>=80?'Rất tốt! Bạn nắm vững nội dung.':
         pct>=50?'Khá ổn, hãy xem lại các câu sai (màu đỏ ở bảng số câu) rồi làm lại.':
         'Hãy đọc lại giáo trình và thử lại nhé!');
    r.style.display='block';
  } else r.style.display='none';
  updateTabs(); updateModes();
}

function loadSession(){
  if(mode==='quiz' && SESS['quiz'+cur]){ order=SESS['quiz'+cur].order; state=SESS['quiz'+cur].state; render(); }
  else build(false);               // mục câu hay sai luôn lấy danh sách mới nhất
}
function switchTab(c){
  if(c===cur) return;
  SESS[skey()]={order,state};
  cur=c; loadSession();
  window.scrollTo({top:0,behavior:'smooth'});
}
function setMode(m){
  if(m===mode) return;
  SESS[skey()]={order,state};
  mode=m; loadSession();
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetQuiz(shuf){ build(shuf); window.scrollTo({top:0,behavior:'smooth'}); }
document.getElementById('reset').onclick=()=>resetQuiz(false);
document.getElementById('shuffle').onclick=()=>resetQuiz(true);
document.getElementById('mode-quiz').onclick=()=>setMode('quiz');
document.getElementById('mode-weak').onclick=()=>setMode('weak');
const autoBox=document.getElementById('auto');
autoBox.checked=autoSave;
autoBox.onchange=()=>{ autoSave=autoBox.checked; persist(); };

function setBarH(){const b=document.querySelector('.bar');document.documentElement.style.setProperty('--barh',b.offsetHeight+'px');}
window.addEventListener('resize',setBarH);

function markCurrent(){
  const line=window.innerHeight*0.35; let found=0;
  document.querySelectorAll('.q').forEach((el,i)=>{ if(el.getBoundingClientRect().top<=line) found=i; });
  if(found!==curIdx){
    const old=document.getElementById('n'+curIdx); if(old) old.classList.remove('cur');
    const n=document.getElementById('n'+found); if(n){ n.classList.add('cur');
      const nav=document.getElementById('nav');
      if(nav.scrollWidth>nav.clientWidth) nav.scrollTo({left:n.offsetLeft-nav.clientWidth/2,behavior:'smooth'});
      else if(nav.scrollHeight>nav.clientHeight) nav.scrollTo({top:n.offsetTop-nav.clientHeight/2,behavior:'smooth'}); }
    curIdx=found;
  }
}
window.addEventListener('scroll',markCurrent,{passive:true});
document.getElementById('nav').addEventListener('click',e=>{
  const a=e.target.closest('a'); if(!a) return; e.preventDefault();
  document.getElementById('q'+a.id.slice(1)).scrollIntoView({behavior:'smooth',block:'start'});
});

buildTabs();
build(false);
setBarH();
</script>
</body>
</html>
